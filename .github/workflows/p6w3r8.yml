name: p6w3r8
run-name: p6w3r8-${{ inputs.r9x4m2 }}

on:
  workflow_dispatch:
    inputs:
      r9x4m2:
        required: true
        type: string
      c8n5hw:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python@sha256:f48dffadeef431c469ddb4d3325abaa084a855cc2ef7c89c9c44537acca23a2b
    timeout-minutes: 360
    # Firefox refuses to run as root when $HOME (Actions sets /github/home) is owned by another user.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # The Playwright Python image ships no Node.js or venv; the bundle's setup needs both.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv
      - id: c
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: p1
      - run: python3 runner.py run
        env:
          H9C3RL: ${{ secrets.H9C3RL }}
          Q8M2VZ: ${{ inputs.r9x4m2 }}
          V6R8XT: ${{ inputs.c8n5hw }}
          P4D7NS: ${{ secrets.P4D7NS }}
      - if: always() && steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: p1
